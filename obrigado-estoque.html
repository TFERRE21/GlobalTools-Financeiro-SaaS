<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8FAFC"><title>Sua planilha de estoque | Base Financeira</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f4f7fb;color:#142d4e;font:16px Inter,Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{max-width:580px;margin:24px;padding:36px;background:white;border-radius:22px;box-shadow:0 20px 60px #142d4e18;text-align:center}.check{font-size:42px;color:#08a875}h1{font-size:29px}p{line-height:1.65;color:#526176}.btn{display:inline-block;border:0;background:#08a875;color:white;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700;margin:16px 0;cursor:pointer}.back{color:#2563eb}small{display:block;color:#64748b}</style></head><body><main class="card"><div class="check">✓</div><h1>Obrigado pela compra!</h1><p>O Stripe precisa confirmar o pagamento antes de liberar o arquivo. Clique abaixo para validar e baixar sua planilha.</p><button id="download" class="btn">Validar pagamento e baixar Excel</button><p id="note" role="status">Aguardando validação do pagamento…</p><small>Se o pagamento ainda estiver pendente, aguarde a confirmação e tente novamente.</small><p><a class="back" href="/#estoque">Voltar ao site</a></p></main><script>const id=new URLSearchParams(location.search).get("session_id"),b=document.getElementById("download"),n=document.getElementById("note");b.addEventListener("click",async()=>{if(!id){n.textContent="Sessão de pagamento não encontrada.";return}b.disabled=true;n.textContent="Validando pagamento no Stripe…";try{const r=await fetch("/api/estoque-download?session_id="+encodeURIComponent(id));if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||"Não foi possível confirmar o pagamento.")}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="Controle_Estoque_e_Validade.xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);n.textContent="Download iniciado. Guarde o arquivo em local seguro."}catch(e){n.textContent=e.message||"Tente novamente em instantes.";b.disabled=false}});</script></body></html>
