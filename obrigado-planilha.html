<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F8FAFC"><title>Compra | Base Financeira</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f4f7fb;color:#142d4e;font:16px Inter,Arial,sans-serif;display:grid;min-height:100vh;place-items:center}.card{max-width:560px;margin:24px;padding:36px;background:white;border-radius:22px;box-shadow:0 20px 60px #142d4e18;text-align:center}h1{font-size:30px}p{line-height:1.6;color:#526176}.btn{display:inline-block;background:#0f766e;color:white;text-decoration:none;padding:14px 22px;border-radius:10px;font-weight:700;margin:16px 0}a.back{color:#2563eb}</style></head><body><main class="card"><div style="font-size:42px">✓</div><h1>Obrigado pela compra!</h1><p>Vamos validar a confirmação do pagamento no Stripe para liberar o arquivo.</p><button id="download" class="btn">Baixar minha planilha</button><p id="note">Aguardando validação do pagamento…</p><a class="back" href="/">Voltar à Base Financeira</a></main><script>const id=new URLSearchParams(location.search).get("session_id"),b=document.getElementById("download"),n=document.getElementById("note");async function enviarEmail(){if(!id){n.textContent="Sessão de pagamento não encontrada.";return}try{const r=await fetch("/api/planilha-entregar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:id})});const d=await r.json();if(r.ok){n.textContent="Planilha enviada para o e-mail informado no pagamento. Confira também o spam.";return}n.textContent=d.error||"Não foi possível confirmar o envio por e-mail. Você ainda pode tentar baixar o arquivo abaixo."}catch(e){n.textContent="Não foi possível confirmar o envio por e-mail. Use o botão para tentar baixar a planilha."}}if(id)enviarEmail();b.addEventListener("click",async()=>{if(!id){n.textContent="Sessão de pagamento não encontrada.";return}b.disabled=true;n.textContent="Validando pagamento e preparando o Excel…";try{const r=await fetch("/api/planilha-download?session_id="+encodeURIComponent(id));if(!r.ok){let d={};try{d=await r.json()}catch{}throw new Error(d.error||"Não foi possível liberar o arquivo.")}const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="Controle_Financeiro_Base_Financeira.xlsx";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u);n.textContent="Download iniciado. Guarde o arquivo em local seguro."}catch(e){n.textContent=e.message||"Tente novamente em instantes.";b.disabled=false}});</script></body></html>
