<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse sua conta Global Tools Financeiro com segurança.">
  <meta name="theme-color" content="#f7f9fc">
  <title>Acessar sua conta | Global Tools Financeiro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root{--auth-gold:#f3b900;--auth-ink:#101b32;--auth-muted:#71809a;--auth-line:#e0e7f1}
    body.auth-page{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#fff 0,#f7f9fd 54%,#eef3fa 100%);color:var(--auth-ink);display:flex;flex-direction:column}
    .auth-header{width:100%;max-width:1320px;margin:0 auto;padding:15px 5.5%;display:flex;align-items:center;justify-content:space-between}
    .auth-brand{display:flex;align-items:center;gap:10px;font-size:18px;letter-spacing:-.6px;flex-shrink:0;color:#10284f}
    .auth-brand-copy{display:flex;flex-direction:column;line-height:1.15}
    .auth-brand b{font-weight:800;color:#163b65}
    .auth-brand-copy small{font-size:8px;letter-spacing:1.2px;color:#5e7190;margin-top:4px}
    .auth-logo-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#2563eb,#08a875);color:#fff;font-weight:900;box-shadow:0 5px 13px #2563eb24;flex-shrink:0;font-size:20px}
    .auth-back{font-size:12px;color:#2563eb;font-weight:600;padding:10px 0;border-bottom:2px solid #2563eb}
    .auth-main{flex:1;display:grid;place-items:center;padding:22px 18px 44px}
    .auth-card{width:min(100%,460px);background:#fff;border:1px solid #e5eaf2;border-radius:22px;padding:34px 34px 30px;box-shadow:0 24px 70px rgba(23,45,78,.10);position:relative;overflow:hidden}
    .auth-card:before{content:"";height:4px;position:absolute;top:0;left:28px;right:28px;background:linear-gradient(90deg,#f3b900,#ffd84b,#f3b900);border-radius:0 0 5px 5px}
    .auth-symbol{width:54px;height:54px;margin:0 auto 14px;border-radius:17px;background:linear-gradient(145deg,#2563eb,#08a875);color:#fff;display:grid;place-items:center;box-shadow:0 9px 25px #2563eb2e;font-size:29px;font-weight:900}
    .auth-symbol span{line-height:1}
    .auth-title{text-align:center;margin:0;color:#101b32;font-size:27px;line-height:1.25;letter-spacing:-.9px;font-weight:800}
    .auth-subtitle{text-align:center;color:#73819a;font-size:13px;margin:8px 0 23px;line-height:1.6}
    .auth-divider{display:flex;align-items:center;gap:12px;color:#8794a8;font-size:10px;margin:0 0 22px}
    .auth-divider:before,.auth-divider:after{content:"";height:1px;background:#e5eaf2;flex:1}
    #authForm{display:flex;flex-direction:column;gap:14px;margin:0}
    #authForm label{display:flex;flex-direction:column;gap:7px;font-size:11px;font-weight:750;color:#273a57}
    #authForm input{width:100%;height:49px;border:1px solid #e0e7f1;border-radius:11px;background:#f7f9fc;padding:0 14px;color:#14233b;font-size:13px;outline:none;transition:border .15s,box-shadow .15s,background .15s}
    #authForm input::placeholder{color:#a0aabc}
    #authForm input:focus{border-color:#e4b51b;background:#fff;box-shadow:0 0 0 3px #f3b90024}
    #authForm label[hidden]{display:none!important}
    #authForm .button{width:100%;min-height:49px;border-radius:11px;font-size:13px;font-weight:800}
    #authSubmit{order:4;background:linear-gradient(100deg,#f6c414,#efb300);color:#17243a;border:0;box-shadow:0 7px 17px #e9b41430}
    #authSubmit:hover{background:linear-gradient(100deg,#ffcf25,#f3b900);box-shadow:0 10px 22px #e9b41440}
    #authSubmit:disabled{opacity:.65;cursor:wait}
    #toggleMode{order:6;border:1px solid #e0e7f1;background:#fff;color:#17243a}
    #toggleMode:hover{background:#f8fafc;border-color:#cbd5e1}
    #authMessage{order:5;margin:0;min-height:0;font-size:12px;line-height:1.5;color:#52647f;text-align:center}
    .auth-split{order:5;display:flex;align-items:center;gap:12px;color:#94a0b2;font-size:10px;margin:1px 0}
    .auth-split:before,.auth-split:after{content:"";height:1px;background:#e8edf4;flex:1}
    .auth-security{display:flex;align-items:center;justify-content:center;gap:7px;color:#8995a8;font-size:10px;margin:20px 0 0;text-align:center}
    .auth-security svg{width:13px;height:13px;color:#0a9b70;flex-shrink:0}
    .auth-footer{text-align:center;color:#9aa5b5;font-size:10px;padding:0 18px 20px}
    .auth-footer a{color:#62748e}
    @media(max-width:520px){.auth-header{padding:14px 16px}.auth-brand{font-size:15px}.auth-logo-mark{width:34px;height:34px}.auth-main{padding:20px 14px 36px;align-items:start}.auth-card{padding:30px 22px 25px;border-radius:18px}.auth-title{font-size:25px}.auth-subtitle{margin-bottom:20px}.auth-back{font-size:11px}.auth-footer{line-height:1.8}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="config.js" defer></script>
  <script src="auth.js" defer></script>
</head>
<body class="auth-page">
<header class="auth-header">
  <a class="auth-brand" href="index.html" aria-label="Global Tools Financeiro - página inicial">
    <span class="auth-logo-mark" aria-hidden="true">B</span>
    <span class="auth-brand-copy">Base <b>Financeira</b><small>GESTÃO FINANCEIRA INTELIGENTE</small></span>
  </a>
  <a class="auth-back" href="index.html">Voltar ao site</a>
</header>
<main class="auth-main">
  <section class="auth-card" aria-labelledby="authTitle">
    <div class="auth-symbol" aria-hidden="true"><span>B</span></div>
    <h1 id="authTitle" class="auth-title">Acesse sua conta</h1>
    <p class="auth-subtitle">Entre para acompanhar suas operações financeiras.</p>
    <div class="auth-divider">ACESSO SEGURO</div>
    <form id="authForm">
      <label>E-mail<input type="email" name="email" autocomplete="email" required maxlength="254" placeholder="voce@empresa.com.br"></label>
      <label>Senha<input type="password" name="password" autocomplete="current-password" minlength="8" required placeholder="Digite sua senha"></label>
      <label id="nameLabel" hidden>Nome completo<input type="text" name="fullName" autocomplete="name" maxlength="120" placeholder="Como podemos chamar você?"></label>
      <button id="authSubmit" class="button primary wide" type="submit">Entrar no sistema →</button>
      <div class="auth-split" aria-hidden="true">ou</div>
      <button id="toggleMode" class="button secondary wide" type="button">＋ Criar nova conta</button>
      <p id="authMessage" role="status" aria-live="polite"></p>
    </form>
    <p class="auth-security"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3 19 6v5c0 4.7-3 8-7 10-4-2-7-5.3-7-10V6l7-3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> Seus dados protegidos • Conexão segura</p>
  </section>
</main>
<footer class="auth-footer">© <span id="authYear">2026</span> Base Financeira · CNPJ 69.623.245/0001-71<br><a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos de uso</a></footer>
<script>document.getElementById("authYear").textContent = new Date().getFullYear();</script>
</body>
</html>
